:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg{max-width:100%}
[hidden]{display:none!important}
/* Layout: app de uma coluna (máx. 720px) sobre um céu estrelado; cabeçalho com estrelas no topo, abas grandes no rodapé, cartões gordinhos com sombra de brinquedo */
:root{
  --sky1:#ffe7f4; --sky2:#e2d8ff;
  --card:#ffffff; --card2:#f8f1ff;
  --ink:#3a1c62; --ink2:#6b5294;
  --pink:#e8378a; --pink-soft:#ffd5ea; --on-pink:#ffffff;
  --lilac:#8b5cf0; --lilac-soft:#ece2ff;
  --gold:#ffb300; --gold-soft:#fff0c4; --gold-ink:#6e4500; --on-gold:#3a2600;
  --done:#14a06e; --done-soft:#d6f6e8; --on-done:#ffffff;
  --line:#e2d1ff; --shade:rgba(84,44,140,.20); --star-dot:#ffbf2e;
  --scrim:rgba(30,12,70,.55);
  --font-display:"Baloo 2","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  --font-body:"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  --r-lg:30px; --r-md:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#110a30; --sky2:#261b66;
    --card:#2b2068; --card2:#36297c;
    --ink:#fff4fb; --ink2:#d4c6fb;
    --pink:#ff78ba; --pink-soft:#5a2772; --on-pink:#2a0a2e;
    --lilac:#b996ff; --lilac-soft:#40318c;
    --gold:#ffc940; --gold-soft:#4d3b16; --gold-ink:#ffe39a; --on-gold:#2e1e00;
    --done:#52e0a8; --done-soft:#1d4a52; --on-done:#0e2a2a;
    --line:#4c3d9c; --shade:rgba(0,0,0,.42); --star-dot:#ffe48f;
    --scrim:rgba(6,2,20,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky1:#110a30; --sky2:#261b66;
  --card:#2b2068; --card2:#36297c;
  --ink:#fff4fb; --ink2:#d4c6fb;
  --pink:#ff78ba; --pink-soft:#5a2772; --on-pink:#2a0a2e;
  --lilac:#b996ff; --lilac-soft:#40318c;
  --gold:#ffc940; --gold-soft:#4d3b16; --gold-ink:#ffe39a; --on-gold:#2e1e00;
  --done:#52e0a8; --done-soft:#1d4a52; --on-done:#0e2a2a;
  --line:#4c3d9c; --shade:rgba(0,0,0,.42); --star-dot:#ffe48f;
  --scrim:rgba(6,2,20,.7);
  color-scheme:dark;
}

[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:radial-gradient(120% 60% at 80% 0%, var(--pink-soft) 0%, transparent 60%), linear-gradient(170deg,var(--sky1),var(--sky2));
  background-attachment:fixed; background-color:var(--sky1);
  color:var(--ink); font-family:var(--font-body); font-size:18px; line-height:1.4;
}
body.lock{overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}

/* céu */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.tw{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:var(--star-dot);opacity:.75;animation:tw var(--d) ease-in-out var(--o) infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.55)}}
.shoot{position:absolute;width:130px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--star-dot),transparent);opacity:0;transform:rotate(-25deg);animation:shoot var(--d) ease-in var(--o) infinite}
@keyframes shoot{0%{opacity:0;transform:rotate(-25deg) translateX(0)}8%{opacity:1}40%{opacity:0;transform:rotate(-25deg) translateX(-280px)}100%{opacity:0}}

.app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding-block:10px 12px;margin-inline:calc(50% - 50vw);padding-inline:calc(50vw - 50% + 16px);background:color-mix(in srgb,var(--sky1) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 14px -12px var(--shade)}
html{overflow-x:clip}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
#dayPanel,.cal{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 100px)}
.chip{min-height:64px;border:0;border-radius:999px;background:var(--card);box-shadow:0 5px 0 var(--shade);display:flex;align-items:center;gap:6px;padding:0 14px;font:800 26px/1 var(--font-display);color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums}
.chip.stars{margin-inline-start:auto;color:var(--gold-ink);background:var(--gold-soft)}
.chip.stars .si{font-size:30px}
.chip.round{width:64px;justify-content:center;padding:0;font-size:28px}
.chip.lvl{font-size:18px;gap:8px;padding:0 16px 0 12px;max-width:52%}
.chip.lvl .ic{font-size:30px}
.chip.lvl .lvl-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@media (max-width:560px){.chip.lvl .lvl-n{display:none}.chip.lvl{padding:0;width:64px;justify-content:center}}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -6px 24px var(--shade)}
.tabs .inner{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;max-width:720px}
.tab{min-height:72px;border:0;border-radius:20px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 14px/1 var(--font-display);color:var(--ink2)}
.tab .i{font-size:32px;line-height:1;transition:transform .25s}
.tab[aria-selected="true"]{background:var(--lilac-soft);color:var(--ink)}
.tab[aria-selected="true"] .i{transform:translateY(-3px) scale(1.12)}

/* herói */
.hero{background:var(--card);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--shade);overflow:hidden;margin-top:4px}
.stage{position:relative;height:236px;overflow:hidden}
.stage .scene,.stage .scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .lara{position:absolute;left:50%;bottom:4px;width:150px;transform:translateX(-50%)}
.stage .luna{position:absolute;left:calc(50% + 66px);bottom:6px;width:86px;transform-origin:50% 100%}
.stage .fairy{position:absolute;left:calc(50% - 190px);top:18px;width:100px;animation:float 3.2s ease-in-out infinite}
@media (max-width:440px){.stage .fairy{left:6px;width:88px}.stage .luna{left:auto;right:6px;width:76px}.stage .lara{left:47%}}
.lvl-tag{position:absolute;right:12px;top:12px;background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px 6px 10px;font:800 16px/1.1 var(--font-display);box-shadow:0 4px 0 var(--shade);display:flex;align-items:center;gap:6px}
.lvl-tag .ic{font-size:22px}
@keyframes float{50%{transform:translateY(-9px)}}
.fi{transform-origin:50% 80%}
.jump{animation:jump .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-38px) rotate(-10deg)}60%{transform:translateY(-10px) rotate(8deg)}}
.dance{animation:dance 1.1s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(-12px)}50%{transform:rotate(12deg)}75%{transform:rotate(-8deg) translateY(-6px)}}
.hop{animation:hop .7s cubic-bezier(.3,1.5,.5,1) 2}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}20%{transform:translateY(0) scaleY(.85)}50%{transform:translateY(-26px) scaleY(1.05)}}
.eyes-h{display:none}
.ltail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.2s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.hop .ltail{animation-duration:.35s}
.happy .eyes-h{display:inline}
.happy .eyes-n{display:none}
.mouth-o{display:none}
.speaking .talkable .mouth-o{display:inline}
.speaking .talkable .mouth-s{display:none}
.mouth-o ellipse{transform-box:fill-box;transform-origin:center}
.speaking .talkable .mouth-o ellipse{animation:mouth .16s ease-in-out infinite alternate}
@keyframes mouth{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
.speaking .talkable svg{animation:talk .38s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes talk{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-4px)}}
.speaking .say p{color:var(--lilac)}
.xpbar{display:flex;align-items:center;gap:10px;padding:10px 16px 0;font:800 17px/1 var(--font-display)}
.xpbar[hidden]{display:none}
.xlv{color:var(--lilac);white-space:nowrap}
.xtrack{flex:1;height:14px;border-radius:99px;background:var(--lilac-soft);overflow:hidden;min-width:0}
.xtrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lilac),var(--pink));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.xnum{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.xpt{font:800 16px/1 var(--font-display);color:var(--lilac);letter-spacing:0;white-space:nowrap}
.xpfloat{position:fixed;z-index:92;pointer-events:none;transform:translate(-50%,-50%);font:800 22px/1 var(--font-display);color:var(--lilac);background:var(--card);border-radius:999px;padding:6px 12px;box-shadow:0 4px 0 var(--shade);animation:xpUp 1.4s ease-out forwards;white-space:nowrap}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.note-day{margin-top:16px;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--shade);padding:12px 14px;border:3px dashed var(--pink)}
.note-day .ni{font-size:40px;line-height:1}
.note-day .nt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.note-day .nl{font:800 15px/1 var(--font-display);color:var(--pink);letter-spacing:.04em;text-transform:uppercase}
.note-day .nm{font:800 21px/1.2 var(--font-display);text-wrap:balance}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.upl{position:relative;align-self:flex-start;cursor:pointer}
.upl:focus-within{outline:4px solid var(--gold);outline-offset:3px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px;color:var(--ink2)}
.vcat{border:2px solid var(--line);border-radius:18px;background:var(--card2)}
.vcat summary{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;font:800 18px/1.2 var(--font-display);cursor:pointer;list-style:none}
.vcat summary::-webkit-details-marker{display:none}
.vcat summary::after{content:"▾";font-size:20px;color:var(--ink2)}
.vcat[open] summary::after{content:"▴"}
.vcount{margin-left:auto;font-size:16px;color:var(--lilac);white-space:nowrap}
.vbody{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px}
.vrow{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.vrow input{min-height:56px;font:700 17px var(--font-body);border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;width:100%;box-sizing:border-box;min-width:0}
.vtask{display:flex;align-items:center;gap:10px}
.vtask .pi{font-size:30px;width:40px;text-align:center}
.vtask .pn{flex:1;min-width:0;font:800 17px/1.2 var(--font-display)}
.note-day.rec{border-color:var(--lilac);background:linear-gradient(135deg,var(--card),var(--lilac-soft))}
.note-day.rec .nl{color:var(--lilac)}
.cal{display:flex;flex-direction:column;gap:8px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calt{font:800 21px/1.1 var(--font-display);text-align:center;flex:1}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cwd{text-align:center;font:800 14px/1 var(--font-display);color:var(--ink2);padding-block:4px}
.cday{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;min-width:0}
.cday.blank{border:0;background:none}
.cday .cn{font:800 16px/1 var(--font-display);font-variant-numeric:tabular-nums}
.cday .cm{font-size:18px;line-height:1;min-height:18px}
.cday.ok{background:var(--done-soft);border-color:var(--done)}
.cday.part{background:var(--gold-soft)}
.cday.fut{opacity:.7}
.cday.today{box-shadow:0 0 0 3px var(--gold)}
.cday.sel{border-color:var(--pink);border-width:3px;opacity:1}
.callegend{margin:0;text-align:center}
.daypanel{display:flex;flex-direction:column;gap:10px;border-top:3px dashed var(--line);padding-top:12px}
.dphead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dpill{font:800 15px/1 var(--font-display);border-radius:999px;padding:8px 12px;background:var(--gold-soft);color:var(--gold-ink);white-space:nowrap}
.dpill.ok{background:var(--done);color:var(--on-done)}
.dpill.fut{background:var(--lilac-soft);color:var(--ink)}
.prow2{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid var(--line)}
.prow2:last-child{border-bottom:0}
.prow2 .pi{font-size:32px;width:40px;text-align:center;flex:none}
.prow2 .pt2{flex:1;min-width:0}
.tchk{width:52px;height:52px;flex:none;border-radius:16px;border:3px solid var(--line);background:var(--card2);font:800 28px/1 var(--font-display);color:var(--on-done);display:grid;place-items:center}
.tchk.on{background:var(--done);border-color:var(--done)}
.glv{font:800 17px/1 var(--font-display);color:var(--lilac)}
.gstars{font-size:16px;letter-spacing:1px;line-height:1}
.soff{filter:grayscale(1);opacity:.3}
.lvpick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lvb{min-width:64px;min-height:72px;border:3px solid var(--line);border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;box-shadow:0 4px 0 var(--shade)}
.lvb .lvn{font:800 28px/1 var(--font-display)}
.lvb .lvs{font-size:9px;line-height:1;letter-spacing:-1px}
.lvb.sel{border-color:var(--pink);background:var(--pink-soft);transform:translateY(-3px)}
.lvb.lock{opacity:.5;box-shadow:none}
.lvb.lock .lvn{font-size:22px}
.lvinfo{margin:-10px 0 0;font:800 20px/1.2 var(--font-display);color:var(--ink2)}
.unlock{display:flex;align-items:center;gap:10px;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:10px 20px;font:800 22px/1.1 var(--font-display);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.unlock .ul1{font-size:32px}
.unlock .ul2{font-size:16px}
.nums.n5{grid-template-columns:repeat(5,1fr)}
.nums.n6{grid-template-columns:repeat(3,1fr)}
.grp .gone{position:relative;opacity:.35}
.grp .gone::after{content:"✖";position:absolute;inset:0;display:grid;place-items:center;color:var(--pink);font-size:.8em;opacity:1}
.subn{font:800 44px/1 var(--font-display);color:var(--pink)}
.mem{grid-template-columns:repeat(4,1fr)}
.mcard{min-height:60px}

.ck-rim{fill:var(--pink)}
.ck-face{fill:var(--card)}
.ck-tk{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.ck-tk5{stroke:var(--ink2);stroke-width:4;stroke-linecap:round}
.ck-num{fill:var(--ink);font:800 22px var(--font-display);text-anchor:middle}
.ck-num.q{fill:var(--pink);font-size:26px}
.ck-twelve{fill:var(--gold)}
.ck-h{stroke:var(--pink);stroke-width:11;stroke-linecap:round}
.ck-m{stroke:var(--lilac);stroke-width:7;stroke-linecap:round}
.ck-s{stroke:var(--gold);stroke-width:2.5;stroke-linecap:round}
.ck-sstar{fill:var(--gold)}
.ck-dot{fill:var(--ink)}
.clockcard{margin-top:14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;background:var(--card);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--shade);padding:18px}
.bigclock{width:min(100%,280px);aspect-ratio:1;max-width:100%}
.bigclock svg{width:100%;height:100%;display:block}
.digital{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.digital .dg{font:800 64px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:2px}
.digital .dd{font:800 20px/1.1 var(--font-display);color:var(--ink2)}
.legend{display:flex;align-items:center;gap:8px;font:700 15px/1.2 var(--font-body);color:var(--ink2)}
.legend i{display:inline-block;width:26px;height:8px;border-radius:9px}
.legend .lh{background:var(--pink);width:18px;height:10px}
.legend .lm{background:var(--lilac)}
.nextbig{margin-top:16px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--card),var(--gold-soft));border:3px solid var(--gold);border-radius:var(--r-lg);padding:14px 16px;box-shadow:0 6px 0 var(--shade)}
.nextbig > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.nextbig .mclock{width:72px;height:72px}
.nb-l{font:800 14px/1 var(--font-display);color:var(--gold-ink);letter-spacing:.05em;text-transform:uppercase}
.nb-n{font:800 24px/1.15 var(--font-display);text-wrap:balance}
.nb-w{font:800 18px/1.1 var(--font-display);color:var(--ink2)}
.mclock{display:inline-block;width:56px;height:56px;flex:none}
.mclock svg{width:100%;height:100%;display:block}
.dchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px}
.dchip{min-height:64px;border:3px solid transparent;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--shade);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 20px/1 var(--font-display);color:var(--ink);padding:0}
.dchip small{font-size:13px;color:var(--ink2)}
.dchip.today{box-shadow:0 0 0 3px var(--gold),0 4px 0 var(--shade)}
.dchip.sel{background:var(--lilac);color:var(--card);border-color:var(--lilac)}
.dchip.sel small{color:var(--card)}
.sday{margin:18px 0 10px;font-size:24px}
.slist{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:22px;box-shadow:0 5px 0 var(--shade);padding:10px 12px;border:3px solid transparent}
.srow.next{border-color:var(--gold)}
.srow.done{background:var(--done-soft);border-color:var(--done)}
.srow.past{opacity:.7}
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.stime{font:800 22px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--pink)}
.sname{font:800 19px/1.2 var(--font-display);text-wrap:balance}
.st{font:800 15px/1 var(--font-display)}
.st.next{color:var(--gold-ink)}
.st.done{color:var(--done)}
.srow .tchk{width:56px;height:56px}
.sbtn{padding:0 16px;font-size:18px;min-height:56px;align-self:flex-start;margin-top:6px}
.sfree{background:var(--card);border-radius:var(--r-lg);padding:22px;text-align:center;font:800 22px/1.2 var(--font-display);box-shadow:0 6px 0 var(--shade)}
.sfree span{display:block;font-size:44px}
.nextup{margin-top:16px;width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--shade);padding:10px 14px;min-height:64px}
.nextup.soon{border-color:var(--gold);background:linear-gradient(135deg,var(--card),var(--gold-soft))}
.nu-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nu-l{font:800 14px/1 var(--font-display);color:var(--pink)}
.nu-n{font:800 20px/1.15 var(--font-display)}
.nu-w{font:700 15px/1 var(--font-body);color:var(--ink2)}
.nu-go{font:800 34px/1 var(--font-display);color:var(--ink2)}
.cklist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.ckitem{min-height:84px;border:3px solid var(--line);border-radius:20px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;padding:8px}
.ckitem .cki{font-size:38px;line-height:1}
.ckitem .ckt{font:800 17px/1.1 var(--font-display)}
.ckitem .ckm{position:absolute;right:8px;top:6px;font:800 22px/1 var(--font-display);color:var(--on-done);width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.ckitem.on{background:var(--done-soft);border-color:var(--done)}
.ckitem.on .ckm{background:var(--done)}
.daysel{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daysel button{min-height:56px;border-radius:14px;border:3px solid var(--line);background:var(--card2);font:800 15px/1 var(--font-display);padding:0}
.daysel button[aria-pressed="true"]{border-color:var(--lilac);background:var(--lilac);color:var(--card)}
.vtask small{font-weight:700;color:var(--ink2)}
@media (max-width:440px){.digital{align-items:center;text-align:center}.digital .dg{font-size:52px}.tab{font-size:12px}.tab .i{font-size:28px}}
.stkw{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;min-width:0}
.stkw .stk{width:100%}
.stkd{font:800 13px/1 var(--font-display);color:var(--ink2);font-variant-numeric:tabular-nums}
.daystk{border:2px solid var(--line);border-radius:18px;background:var(--card2)}
.daystk summary{display:flex;align-items:center;gap:12px;padding:8px 12px;cursor:pointer;list-style:none;min-height:64px}
.daystk summary::-webkit-details-marker{display:none}
.daystk summary::after{content:"▾";margin-left:auto;color:var(--ink2);font-size:20px}
.daystk[open] summary::after{content:"▴"}
.daystk .stk{width:56px;font-size:30px;flex:none;border-width:4px}
.dst{display:flex;flex-direction:column;gap:2px;min-width:0}
.daystk .stkpick{padding:0 12px 12px}
.daystk .pn{font:800 18px/1.2 var(--font-display)}
.daystk .pm{font-size:14px;color:var(--ink2);font-weight:700}
.stkpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.stkpick button{min-height:52px;font-size:28px;border-radius:14px;border:3px solid var(--line);background:var(--card2)}
.stkpick button[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.tag{align-self:flex-start;font:800 13px/1 var(--font-display);background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:5px 9px}
.swopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.swopt{min-height:110px;border:3px solid var(--line);border-radius:20px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center}
.swopt:active{transform:scale(.97)}
.swopt .si{font-size:38px;line-height:1}
.swopt .sn{font:800 16px/1.15 var(--font-display)}
.swopt .sp{font:800 14px/1 var(--font-display);color:var(--gold-ink)}
.swform{border-top:3px dashed var(--line);padding-top:12px}
.pform textarea{font:700 18px/1.4 var(--font-body);border-radius:16px;border:2px solid var(--line);background:var(--card2);color:var(--ink);padding:12px 14px;width:100%;box-sizing:border-box;resize:vertical}
.say{display:flex;gap:12px;align-items:center;padding:14px 14px 14px 20px;border-top:3px dashed var(--line)}
.say p{margin:0;flex:1;min-width:0;font:800 23px/1.2 var(--font-display);text-wrap:balance}
.spk{width:64px;height:64px;flex:none;border:0;border-radius:50%;background:var(--lilac-soft);font-size:28px;display:grid;place-items:center;box-shadow:0 4px 0 var(--shade)}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}

/* jornada */
.journey{margin-top:16px;background:var(--card);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--shade);padding:12px 14px 10px}
.jrow{display:flex;align-items:center;gap:6px}
.track-wrap{position:relative;flex:1;height:84px;min-width:0}
.track{position:absolute;left:26px;right:0;top:50%;height:20px;transform:translateY(-50%);border-radius:99px;background:var(--lilac-soft)}
.fill{height:100%;width:calc(var(--p) * 100%);border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.tdot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--card);transform:translate(-50%,-50%);transition:background .4s}
.tdot.on{background:var(--gold-soft);box-shadow:0 0 0 3px var(--gold)}
.ship{position:absolute;top:50%;left:calc(26px + (100% - 26px) * var(--p));transform:translate(-55%,-62%) rotate(8deg);font-size:46px;line-height:1;transition:left .9s cubic-bezier(.3,1.3,.5,1);filter:drop-shadow(0 4px 0 var(--shade))}
.goal{width:84px;flex:none}
.goal.arrived{animation:hop .8s ease 3}
.jcount{display:flex;justify-content:center;gap:6px;font:800 20px/1 var(--font-display);color:var(--ink2);font-variant-numeric:tabular-nums}

/* blocos e missões */
.block{margin-top:24px}
.block-head{display:inline-flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:6px 20px 6px 10px;min-height:56px;font:800 23px/1 var(--font-display);box-shadow:0 4px 0 var(--shade)}
.block-head .bi{font-size:30px}
.block-head .bluna{width:52px;margin-block:-8px}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:12px}
.task{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r-md);box-shadow:0 6px 0 var(--shade);padding:12px;min-height:108px;border:3px solid transparent;transition:background .3s,border-color .3s}
.task .go{flex:1;display:flex;align-items:center;gap:14px;background:none;border:0;text-align:left;padding:0;min-height:84px;min-width:0;border-radius:18px;transition:transform .12s}
.task .go:active{transform:scale(.96)}
.task .ic{width:80px;height:80px;flex:none;border-radius:24px;background:var(--pink-soft);display:grid;place-items:center;font-size:48px;line-height:1}
.task .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.task .nm{font:800 21px/1.15 var(--font-display)}
.task .pts{font-size:20px;letter-spacing:1px}
.task.done{background:var(--done-soft);border-color:var(--done)}
.task.done .ic{background:var(--card)}
.okmark{position:absolute;left:64px;top:2px;width:48px;height:48px;border-radius:50%;background:var(--done);color:var(--on-done);display:grid;place-items:center;font:800 30px/1 var(--font-display);box-shadow:0 3px 0 var(--shade);pointer-events:none}
.okmark.fresh{animation:okpop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes okpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.task .ic.no{position:relative}
.task .ic.no::after{content:"🚫";position:absolute;right:-8px;bottom:-8px;font-size:30px}
.piggy{margin-top:16px;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--shade);padding:12px 14px;border:3px solid transparent}
.piggy.rich{border-color:var(--gold);background:linear-gradient(135deg,var(--card),var(--gold-soft))}
.pig{width:104px;flex:none;border:0;background:none;padding:0;min-height:64px}
.pig .pcoin{animation:coinDrop 2.6s ease-in infinite}
@keyframes coinDrop{0%,55%{transform:translateY(-14px);opacity:0}65%{opacity:1}85%{transform:translateY(20px);opacity:1}100%{transform:translateY(24px);opacity:0}}
.piggy.rich .pig{animation:dance 1.4s ease-in-out infinite}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ptitle{font:800 20px/1.1 var(--font-display)}
.coins{display:flex;gap:4px;flex-wrap:wrap}
.coin{width:32px;height:32px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font-size:24px;line-height:1;box-sizing:border-box}
.coin.on{border:0}
.coin.fresh{animation:coinIn .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes coinIn{0%{transform:translateY(-60px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.pmsg{font:800 18px/1.2 var(--font-display);color:var(--ink2)}
.piggy.rich .pmsg{color:var(--gold-ink);font-size:20px}
.psaved{font:700 15px/1.2 var(--font-body);color:var(--ink2)}
.pigbig{width:170px}
.money{color:var(--gold-ink)}
.task.off{background:var(--card2);border:3px dashed var(--line);box-shadow:none}
.task.off .ic{opacity:.55;background:var(--lilac-soft)}
.offmsg{font:800 18px/1.2 var(--font-display);color:var(--lilac)}

/* partículas */
.pt{position:fixed;z-index:90;pointer-events:none;left:0;top:0;line-height:1;font-size:var(--s,22px);transform:translate(-50%,-50%);animation:fly var(--t,950ms) cubic-bezier(.12,.7,.3,1) forwards}
.pt.dust{width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}75%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
.flystar{position:fixed;z-index:91;pointer-events:none;left:0;top:0;font-size:34px;line-height:1;transform:translate(-50%,-50%);transition:transform .75s cubic-bezier(.5,-0.4,.6,1),opacity .2s .7s}

/* títulos de painel */
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
@media (max-width:440px){
  .pill{font-size:20px;min-height:52px;padding:6px 16px 6px 10px}
  .panel-head{flex-wrap:nowrap}
  .panel-head .pill{white-space:nowrap;min-width:0;gap:8px}
  .pill .bi{font-size:26px}
  .calt{font-size:19px}
  .card.pcard{padding:14px}
  .pcard h3{font-size:20px}
  .top{padding-block:8px 10px}
}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:8px 22px 8px 12px;min-height:56px;font:800 26px/1 var(--font-display);box-shadow:0 4px 0 var(--shade)}
.pill .bi{font-size:32px}
.sec{margin-top:26px}

/* botões */
.btn{min-height:64px;border:0;border-radius:22px;padding:0 24px;font:800 22px/1 var(--font-display);background:var(--pink);color:var(--on-pink);box-shadow:0 5px 0 var(--shade);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shade)}
.btn.alt{background:var(--lilac-soft);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.good{background:var(--done);color:var(--on-done)}
.btn.danger{background:transparent;color:var(--pink);box-shadow:none;border:3px solid var(--pink)}
.btn.round{width:64px;padding:0;border-radius:50%;font-size:28px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* jogos */
.tickets{display:flex;gap:4px;align-items:center;background:var(--card);border-radius:999px;padding:8px 16px;min-height:56px;font-size:28px;box-shadow:0 4px 0 var(--shade)}
.tickets .used{opacity:.25;filter:grayscale(1)}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;border:0;border-radius:var(--r-lg);background:var(--card);box-shadow:0 6px 0 var(--shade);padding:14px 10px;transition:transform .15s}
.gcard:active{transform:scale(.96)}
.gart{font-size:54px;line-height:1;display:flex;gap:2px}
.gname{font:800 21px/1.1 var(--font-display);text-align:center}
.gcost{font:800 20px/1 var(--font-display);background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:8px 14px;display:flex;gap:6px;align-items:center}
.gcard.locked .gart{filter:grayscale(.7);opacity:.55}
.gcard.open{border:3px solid var(--gold)}
.rest{margin-top:16px;background:var(--card);border-radius:var(--r-lg);padding:18px;text-align:center;font:800 22px/1.2 var(--font-display);box-shadow:0 6px 0 var(--shade)}
.rest .big{font-size:56px;display:block}

/* jogo em tela cheia */
.game{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--sky1),var(--sky2));padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gtitle{font:800 26px/1 var(--font-display);display:flex;gap:8px;align-items:center}
.gstage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:auto;padding-block:8px}
.intro{display:flex;flex-direction:column;align-items:center;gap:26px}
.demo{display:flex;align-items:center;gap:12px;font-size:54px;line-height:1;background:var(--card);border-radius:var(--r-lg);padding:20px 26px;box-shadow:0 6px 0 var(--shade);flex-wrap:wrap;justify-content:center}
.hand{display:inline-block;animation:tap 1.2s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(12px) scale(.9)}}
.play{width:112px;height:112px;border-radius:50%;border:0;background:var(--pink);color:var(--on-pink);font-size:52px;box-shadow:0 7px 0 var(--shade);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.quase{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;background:var(--card);color:var(--ink);border-radius:999px;padding:12px 22px;font:800 24px/1 var(--font-display);box-shadow:0 5px 0 var(--shade);white-space:nowrap;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.gbar{display:flex;align-items:center;gap:12px;width:min(100%,560px)}
.gtime{flex:1;height:16px;border-radius:99px;background:var(--lilac-soft);overflow:hidden}
.gtime i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));transform-origin:left}
.gscore{font:800 28px/1 var(--font-display);font-variant-numeric:tabular-nums;background:var(--card);border-radius:999px;padding:10px 18px;box-shadow:0 4px 0 var(--shade)}
.rounds{display:flex;gap:8px;justify-content:center;flex:1;font-size:24px}
.rounds .r{opacity:.3}
.rounds .r.on{opacity:1}

.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,540px)}
.mcard{position:relative;aspect-ratio:3/4;min-height:72px;border:0;padding:0;background:none;perspective:600px}
.mcard .face{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .4s;box-shadow:0 5px 0 var(--shade)}
.mcard .back{background:linear-gradient(135deg,var(--lilac),var(--pink));}
.mcard .back::after{content:"✦";font-size:34px;color:var(--card);opacity:.9}
.mcard .front{background:var(--card);font-size:clamp(34px,9vw,58px);transform:rotateY(180deg)}
.mcard.up .back{transform:rotateY(180deg)}
.mcard.up .front{transform:rotateY(360deg)}
.mcard.got .front{background:var(--done-soft);box-shadow:0 0 0 4px var(--done)}

.catch{position:relative;width:100%;max-width:720px;flex:1;min-height:320px;border-radius:var(--r-lg);overflow:hidden;background:radial-gradient(80% 60% at 50% 100%,#4b2f9c 0%,transparent 70%),linear-gradient(#120d3e,#2c1f78)}
.fall{position:absolute;top:0;width:80px;height:80px;border:0;background:transparent;font-size:54px;line-height:1;animation:fallDown linear forwards;filter:drop-shadow(0 0 10px rgba(255,214,90,.7))}
@keyframes fallDown{from{transform:translateY(-90px) rotate(0)}to{transform:translateY(var(--h)) rotate(200deg)}}

.pz-board{position:relative;display:grid;width:min(100%,460px);aspect-ratio:3/2;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 6px 0 var(--shade)}
.pz-board .ghost{position:absolute;inset:0;background-size:cover;opacity:.2;pointer-events:none}
.slot{position:relative;border:2px dashed var(--lilac);background:transparent;padding:0;min-height:64px;background-repeat:no-repeat}
.slot.filled{border:0;animation:pop .45s}
.pz-tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(100%,560px)}
.piece{border:4px solid var(--card);border-radius:14px;padding:0;background-repeat:no-repeat;box-shadow:0 5px 0 var(--shade);min-height:64px;transition:transform .2s}
.piece.sel{transform:scale(1.08) translateY(-6px);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 8px 0 var(--shade)}
.pzmini{display:grid;gap:4px}
.pzmini i{width:22px;height:22px;border-radius:5px;background:var(--on-pink);opacity:.9}
.pzmini.c4{grid-template-columns:repeat(2,22px)}
.pzmini.c6{grid-template-columns:repeat(3,22px)}
.btn.big{min-height:96px;min-width:120px;border-radius:26px}

.cnt{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:0 6px 0 var(--shade);min-height:140px;width:min(100%,560px)}
.grp{display:grid;grid-template-columns:repeat(5,auto);gap:6px;font-size:clamp(34px,8vw,48px);line-height:1}
.plus{font-size:40px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(100%,560px)}
.num{min-height:72px;border:0;border-radius:20px;background:var(--card);color:var(--ink);font:800 36px/1 var(--font-display);box-shadow:0 5px 0 var(--shade)}
.num.right{background:var(--done);color:var(--on-done)}

.finish{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.finish .fz{width:170px}
.finish .lz{width:110px;margin-top:-30px}
.finish .big{font:800 30px/1.15 var(--font-display);margin:0;text-wrap:balance}

/* álbum */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--shade);padding:16px}
.statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px;align-items:start}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.stat .big{font:800 44px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat .lab{font:700 17px/1.2 var(--font-display);color:var(--ink2)}
.lbar{width:100%;height:14px;border-radius:99px;background:var(--lilac-soft);overflow:hidden}
.lbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:99px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{background:var(--card);border-radius:18px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--shade);min-height:104px;justify-content:center}
.day .d{font:800 17px/1 var(--font-display);color:var(--ink2)}
.day .f{font-size:32px;line-height:1}
.day .s{font:800 14px/1 var(--font-display);color:var(--gold-ink);font-variant-numeric:tabular-nums;min-height:14px}
.day.today{box-shadow:0 0 0 4px var(--gold),0 4px 0 var(--shade)}
.day.future .f{opacity:.3}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px;margin-top:12px}
.stk{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:44px;background:var(--c);border:5px solid var(--card);box-shadow:0 5px 0 var(--shade);transform:rotate(var(--rot))}
.stk.empty{background:transparent;border:3px dashed var(--line);box-shadow:none;font-size:24px;color:var(--line)}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px}
.tro{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px}
.tro .m{font-size:50px;line-height:1}
.tro .tn{font:800 17px/1.15 var(--font-display)}
.tro.lock .m{filter:grayscale(1);opacity:.35}
.tro.lock .tn{color:var(--ink2);opacity:.75}

/* loja */
.shop-prev{display:flex;align-items:flex-end;justify-content:center;gap:4px;position:relative;height:200px;border-radius:var(--r-lg);overflow:hidden;box-shadow:0 6px 0 var(--shade);margin-top:14px}
.shop-prev .scene,.shop-prev .scene svg{position:absolute;inset:0;width:100%;height:100%}
.shop-prev .lara{position:relative;width:140px}
.shop-prev .luna{position:relative;width:80px;margin-bottom:4px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;min-height:64px;min-width:64px;border:0;border-radius:999px;background:var(--card);box-shadow:0 4px 0 var(--shade);display:flex;align-items:center;gap:8px;padding:0 18px 0 14px;font:800 18px/1 var(--font-display)}
.cat .i{font-size:28px}
.cat[aria-pressed="true"]{background:var(--lilac);color:var(--card)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:6px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:3px solid transparent;border-radius:24px;padding:12px;box-shadow:0 6px 0 var(--shade);min-height:64px}
.item:active{transform:scale(.97)}
.item .prev{width:100%;aspect-ratio:1;border-radius:18px;background:var(--card2);display:grid;place-items:center;overflow:hidden;position:relative}
.item .prev svg{width:82%;height:82%}
.item .prev.full svg{position:absolute;inset:0;width:100%;height:100%}
.item .prev .em{font-size:68px;line-height:1}
.item .nm{font:800 17px/1.15 var(--font-display);text-align:center}
.price{font:800 20px/1 var(--font-display);background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:8px 14px}
.price.use{background:var(--lilac-soft);color:var(--ink)}
.price.on{background:var(--done);color:var(--on-done)}
.item.on{border-color:var(--done)}
.item.cant .prev{opacity:.6}

/* pais */
.pform{display:flex;flex-direction:column;gap:12px}
.pform label,.plabel{font:800 18px/1.2 var(--font-display)}
.pform input[type=text],.pform input[type=number],.pform input[type=date]{min-height:60px;font:700 20px var(--font-body);border-radius:16px;border:2px solid var(--line);background:var(--card2);color:var(--ink);padding:0 14px;width:100%;box-sizing:border-box}
.psel{min-height:60px;font:700 18px var(--font-body);border-radius:16px;border:2px solid var(--line);background:var(--card2);color:var(--ink);padding:0 12px;width:100%;max-width:100%}
.rangeRow{display:flex;align-items:center;gap:12px;font-size:30px}
.rangeRow input{flex:1;min-width:0;height:44px;accent-color:var(--pink)}
.note{background:var(--gold-soft);color:var(--gold-ink);border-radius:18px;padding:12px 16px;font-weight:700;font-size:16px}
.note.ok{background:var(--done-soft);color:var(--ink)}
.prow{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pi{font-size:40px;text-align:center}
.prow .pn,.prow2 .pn{font:800 19px/1.2 var(--font-display);min-width:0}
.prow .pm,.prow2 .pm{font-size:15px;color:var(--ink2);font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{min-width:70px;text-align:center;font:800 30px/1 var(--font-display);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{min-height:64px;border-radius:18px;border:3px solid var(--line);background:var(--card2);font:800 18px/1.1 var(--font-display);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{border-color:var(--lilac);background:var(--lilac-soft)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.emoji-grid button{min-height:64px;font-size:32px;border-radius:16px;border:3px solid var(--line);background:var(--card2)}
.emoji-grid button[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.chk{display:flex;align-items:center;gap:12px;min-height:64px;font:800 19px var(--font-display)}
.chk input{width:32px;height:32px;accent-color:var(--pink)}
.gate{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;margin-top:16px}
.gate .q{font:800 44px/1 var(--font-display);font-variant-numeric:tabular-nums}
.gate input{max-width:200px;text-align:center;font-size:30px !important}
.pcard{margin-top:16px}
.pcard h3{font-size:22px;margin-bottom:10px}
.small{font-size:15px;color:var(--ink2);font-weight:700}

.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--scrim);padding:16px}

function burst(x, y, n = 22) {

  for (let i = 0; i < n; i++) {
    const el = document.createElement('span');

    const dust = Math.random() < 0.45;
    el.className = 'pt' + (dust ? ' dust' : '');
    if (!dust) el.textContent = rnd(['⭐', '✨', '💫', '🌟']);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
    el.style.setProperty('--dy', (Math.sin(ang) * dist - 30).toFixed(0) + 'px');
    el.style.setProperty('--r', (rint(360) - 180) + 'deg');
    el.style.setProperty('--s', dust ? (6 + rint(8)) + 'px' : (18 + rint(16)) + 'px');
    el.style.setProperty('--c', rnd(DUST));
    el.style.setProperty('--t', (800 + rint(500)) + 'ms');
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
    setTimeout(() => el.remove(), 2000);
  }
}

function modal(html, onMount, cls = '') { MQ.push({ html, onMount, cls }); if (!modalOpen) nextModal(); }
function nextModal() {

  if (!m) { box.hidden = true; box.innerHTML = ''; modalOpen = false; return; }
  modalOpen = true; box.hidden = false;

/* ---------- missões ---------- */
let justDone = null;
/* marca ou desmarca uma missão em qualquer dia, com estrelas, XP e contadores */
function setTaskDone(k, t, on) {
  const h = hist(k);
  if (!!h.done[t.id] === on) return null;
  const sg = on ? 1 : -1; const gx = taskXP(t);
  if (on) h.done[t.id] = true; else delete h.done[t.id];
  h.earned = Math.max(0, (h.earned || 0) + sg * t.pts);
  S.stars = Math.max(0, S.stars + sg * t.pts); S.earned = Math.max(0, S.earned + sg * t.pts);
  if (S.xpOn) S.xp = Math.max(0, S.xp + sg * gx);
  S.counts.tasks = Math.max(0, S.counts.tasks + sg);
  if (isBrush(t)) S.counts.brush = Math.max(0, S.counts.brush + sg);
  if (t.block === 'luna') S.counts.luna = Math.max(0, S.counts.luna + sg);
  if (t.block === 'alimentacao') S.counts.food = Math.max(0, (S.counts.food || 0) + sg);
  return refreshDay(k);
}
/* recalcula se o dia está completo; adesivo, bônus de XP e cofrinho saem uma vez por dia */
function refreshDay(k, upgradeOnly) {
  const h = hist(k); const all = dayTasks(k); const was = !!h.complete;
  const now = all.length > 0 && all.every(x => h.done[x.id]);
  if (upgradeOnly && !now) return { sticker: null, reward: null };
  h.complete = now; h.ts = Date.now();
  let sticker = null, reward = null;
  if (now && !h.stk) { h.stk = true; sticker = newSticker(k); if (S.xpOn) S.xp += XP_DAY; if (k === todayKey()) coinFresh = true; }
  if (now) reward = grantReward(k);
  if (now !== was || sticker) S.best = Math.max(S.best || 0, longestStreak());
  return { sticker, reward };
}
/* ao abrir: completa sozinho os dias recentes em que todas as missões estão marcadas */
function healDays() {
  for (let i = 0; i <= 21; i++) {
    const k = addDays(todayKey(), -i); const h = S.history[k];
    if (h && !h.complete && Object.keys(h.done || {}).length) refreshDay(k, true);
  }
}
function doTask(id, el) {

  const res = setTaskDone(k, t, true) || {};

      const g = box.querySelector('[data-go]'); if (g) g.addEventListener('click', () => showTab('album'));
    });
  }, 900);

  if (S.xpOn && lvAfter > lvBefore && after === before) setTimeout(() => levelToast(lvAfter), sticker ? 1300 : 500);
  if (after > before) {

    }, sticker ? 1000 : 900);

  trophies.forEach((tr, i) => setTimeout(() => { toast(tr.icon, `Troféu novo: ${tr.name}!`); chime('big'); }, 1400 + i * 3300));

/* cofrinho: quando a meta da semana é alcançada, registra a recompensa (uma por semana) */
let coinFresh = false;
function grantReward(k = todayKey()) {
  if (!S.reward.on) return null;
  const wk = weekStart(k);
  if (S.rewards[wk]) return null;
  if (weekDone(k) < S.reward.goal) return null;
  const r = { value: S.reward.value, date: todayKey(), paid: false };
  S.rewards[wk] = r; urgentPush = true; return r;
}

function newSticker(k = todayKey()) {

  const st = { e: rnd(fresh.length ? fresh : STICKERS), c: rnd(STK_COLORS), r: rint(16) - 8, d: k };

function gCount(st) {

function daysLabel(days) {

/* relógio de ponteiros: ponteiro pequeno = hora (rosa), grande = minutos (lilás) */
function clockSVG(h, m, sec, big) {

    marks += `<line x1="${(100 + Math.sin(a) * r1).toFixed(1)}" y1="${(100 - Math.cos(a) * r1).toFixed(1)}" x2="${(100 + Math.sin(a) * r2).toFixed(1)}" y2="${(100 - Math.cos(a) * r2).toFixed(1)}" class="${hr ? 'ck-tk5' : 'ck-tk'}"/>`;
  }
  let nums = '';
  if (big) for (let n = 1; n <= 12; n++) { const a = n * 30 * Math.PI / 180; nums += `<text x="${(100 + Math.sin(a) * 66).toFixed(1)}" y="${(100 - Math.cos(a) * 66 + 7).toFixed(1)}" class="ck-num ${n % 3 === 0 ? 'q' : ''}">${n}</text>`; }
  else nums = `<circle cx="100" cy="24" r="6" class="ck-twelve"/>`;
  const sec_ = big ? `<g id="ckS" transform="rotate(${sA} 100 100)"><line x1="100" y1="114" x2="100" y2="26" class="ck-s"/><path d="${starPath(100, 26, 8, 3.4)}" class="ck-sstar"/></g>` : '';

}

  if (current !== 'relogio' || document.hidden) return;
  const d = new Date(); const h = d.getHours(), m = d.getMinutes(), sc = d.getSeconds();
  const set = (id, a) => { const g = document.getElementById(id); if (g) g.setAttribute('transform', `rotate(${a} 100 100)`); };
  set('ckH', ((h % 12) + m / 60) * 30); set('ckM', (m + sc / 60) * 6); set('ckS', sc * 6);
  const dg = $('#digital'); if (dg) dg.textContent = `${pad(h)}:${pad(m)}`;
}
setInterval(tickClock, 1000);
/* avisos: na hora e 5 minutos antes (só com o app aberto) */
const fired = new Set(); let lastMinute = -1;
function minuteTick() {
  const d = new Date(); const mm = d.getHours() * 60 + d.getMinutes();
  if (mm === lastMinute) return; lastMinute = mm;
  const k = todayKey(); const n = nowMin();
  itemsFor(k).forEach(it => {
    const t = toMin(it.time);
    if (S.schedPre && n >= t - 5 && n < t - 2 && !fired.has(k + it.id + 'p')) {
      fired.add(k + it.id + 'p'); chime('soft'); toast(it.icon, `Daqui a 5 minutos: ${it.name}`, false);
      if (!S.muted) playOrSpeak(null, `${NAME}, daqui a 5 minutos: ${it.name}`);
    }
    if (S.schedAlert && n >= t && n < t + 3 && !fired.has(k + it.id + 'o')) {
      fired.add(k + it.id + 'o'); chime('big'); toast(it.icon, `Hora de: ${it.name}!`, false); fairy('dance');
      if (!S.muted) playOrSpeak('hora:' + it.id, `${NAME}! Agora: ${it.name}!`);
    }
  });
  renderNextUp();
  if (current === 'relogio') renderClock();
}
setInterval(minuteTick, 10000);
function markSched(k, it) {

  S.counts.sched = (S.counts.sched || 0) + 1;
  const lvB = xpLevel(); if (S.xpOn) S.xp += 5;
  const trophies = checkTrophies(); save();
  chime('ok'); confetti(); fairy('jump');
  const msg = rnd([`Pontual como uma astronauta, ${NAME}!`, `Na hora certinha, ${NAME}!`, `Você está craque no relógio!`, `Que princesa organizada!`]);
  say(msg, 'elogio'); toast('⏰', S.xpOn ? `${msg} +5 XP ⚡` : msg, false);
  if (S.xpOn && xpLevel() > lvB) setTimeout(() => levelToast(xpLevel()), 1200);
  trophies.forEach((tr, i) => setTimeout(() => { toast(tr.icon, `Troféu novo: ${tr.name}!`); chime('big'); }, 3400 + i * 3300));

}

function calendarHTML() {
  if (!calMonth) calMonth = monthOf(planDay);

  const title = first.toLocaleDateString('pt-BR', { month: 'long' }) + ' ' + first.getFullYear();
  const lead = (first.getDay() + 6) % 7;
  const dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cday blank"></span>';
  for (let d = 1; d <= dim; d++) {
    const k = keyOf(new Date(first.getFullYear(), first.getMonth(), d)); const st = dayStatus(k);
    const fut = k > today; const ed = (S.dayEdits || {})[k]; const hasEdit = ed && ((ed.skip || []).length || Object.keys(ed.swaps || {}).length || (ed.extra || []).length);
    const mark = st.complete ? '😄' : st.has ? '🙂' : fut ? (hasEdit ? '🔄' : '') : '';
    const cls = ['cday', st.complete ? 'ok' : st.has ? 'part' : '', fut ? 'fut' : '', k === today ? 'today' : '', k === planDay ? 'sel' : ''].join(' ');
    const lab = `${d}${st.complete ? ', dia completo' : st.has ? `, ${st.n} de ${st.total} missões` : ''}`;
    cells += `<button class="${cls}" data-cday="${k}" aria-label="${lab}" aria-pressed="${k === planDay}"><span class="cn">${d}</span><span class="cm">${mark}</span></button>`;
  }

function swapSheet(mode, k, orig) {
  const draft = { icon: '⭐', name: '', pts: 2, block: orig ? orig.block : 'casa', keep: true };
  let showForm = mode === 'bank';
  const title = mode === 'swap' ? `Trocar “${esc(orig.name)}”` : mode === 'extra' ? 'Missão extra' : 'Nova opção de troca';
  const draw = box => {
    const sheet = box.querySelector('.sheet');
    const opts = (S.swapBank || []).map(b => `<button class="swopt" data-pick="${b.id}"><span class="si">${esc(b.icon)}</span><span class="sn">${esc(b.name)}</span><span class="sp">${b.pts} ⭐</span></button>`).join('');
    const form = `<div class="pform swform">
        <div class="plabel">Ícone</div>
        <div class="emoji-grid">${TASK_EMOJI.map(em => `<button data-sem="${em}" aria-pressed="${draft.icon === em}">${em}</button>`).join('')}</div>
        <label for="sName">Nome curto</label><input id="sName" type="text" maxlength="40" value="${esc(draft.name)}" placeholder="Ex.: Regar as plantas">
        <div class="plabel">Estrelas</div>
        <div class="stepper"><button class="btn alt round" data-sp="-1" aria-label="Menos">−</button><output>${draft.pts} ⭐</output><button class="btn alt round" data-sp="1" aria-label="Mais">+</button></div>
        <div class="plabel">Bloco</div>
        <div class="seg">${Object.entries(BLOCKS).map(([bk, B]) => `<button data-sblk="${bk}" aria-pressed="${draft.block === bk}">${B.ic} ${B.n}</button>`).join('')}</div>
        ${mode !== 'bank' ? `<label class="chk"><input type="checkbox" id="sKeep" ${draft.keep ? 'checked' : ''}> Guardar nas opções de troca</label>` : ''}
        <p class="small" id="sMsg" style="margin:0;min-height:1.2em"></p>
        <button class="btn" id="sUse">${mode === 'bank' ? 'Salvar opção' : 'Usar esta atividade'}</button>
      </div>`;
    sheet.innerHTML = `<h3 style="font-size:26px">${title}</h3>
      ${mode !== 'bank' ? `<p class="small" style="margin:0">${esc(dayLabel(k))}</p>` : ''}
      ${mode !== 'bank' ? `<div class="swopts">${opts}</div>` : ''}
      ${mode === 'swap' ? `<button class="btn alt" id="sSkip">💤 Só dar folga (sem troca)</button>` : ''}
      ${mode !== 'bank' && !showForm ? `<button class="btn alt" id="sNew">＋ Outra atividade</button>` : ''}
      ${showForm ? form : ''}
      <button class="btn alt" data-close>Cancelar</button>`;
  };
  const apply = item => {
    const e = editOf(k); const clean = { icon: item.icon, name: item.name, pts: item.pts, block: item.block };
    if (mode === 'swap') { e.swaps[orig.id] = clean; e.skip = e.skip.filter(x => x !== orig.id); }
    else if (mode === 'extra') e.extra.push(Object.assign({ id: 'ex' + Date.now().toString(36) + rint(1000), sched: 'all', alt: false }, clean));
    afterPlanChange(k); nextModal();
    toast('🔄', mode === 'swap' ? `Trocado por “${item.name}”` : `Incluído: “${item.name}”`, false);
  };
  modal('', box => {
    draw(box);
    const sheet = box.querySelector('.sheet');
    const sync = () => { const n = $('#sName'); if (n) draft.name = n.value; const kp = $('#sKeep'); if (kp) draft.keep = kp.checked; };
    sheet.onclick = ev => {
      const pk = ev.target.closest('[data-pick]'); if (pk) { const b = S.swapBank.find(x => x.id === pk.dataset.pick); if (b) apply(b); return; }
      if (ev.target.closest('#sSkip')) { const e = editOf(k); delete e.swaps[orig.id]; if (!e.skip.includes(orig.id)) e.skip.push(orig.id); afterPlanChange(k); nextModal(); toast('💤', `Folga de “${orig.name}” neste dia`, false); return; }
      if (ev.target.closest('#sNew')) { showForm = true; draw(box); const n = $('#sName'); if (n) n.focus(); return; }
      const em = ev.target.closest('[data-sem]'); if (em) { sync(); draft.icon = em.dataset.sem; draw(box); return; }
      const sp = ev.target.closest('[data-sp]'); if (sp) { sync(); draft.pts = Math.min(10, Math.max(1, draft.pts + +sp.dataset.sp)); draw(box); return; }
      const sb = ev.target.closest('[data-sblk]'); if (sb) { sync(); draft.block = sb.dataset.sblk; draw(box); return; }
      if (ev.target.closest('#sUse')) {
        sync(); draft.name = draft.name.trim();
        if (!draft.name) { $('#sMsg').textContent = 'Escreva um nome para a atividade.'; return; }
        const item = { icon: draft.icon, name: draft.name, pts: draft.pts, block: draft.block };
        if (mode === 'bank' || draft.keep) S.swapBank = (S.swapBank || []).concat([Object.assign({ id: 'sb' + Date.now().toString(36) }, item)]);
        if (mode === 'bank') { save(); nextModal(); renderParents(); toast('✨', `Nova opção: “${item.name}”`, false); return; }
        apply(item);
      }
    };
  }, 'form');
}

async function addClip(cat, file) {
  if (!file) return;
  if (!(/^audio\//.test(file.type) || /^video\/(mp4|webm|3gpp)/.test(file.type) || AUDIO_EXT.test(file.name))) { toast('🎙️', 'Esse arquivo não parece ser um áudio.', false); return; }
  if (file.size > 8 * 1024 * 1024) { toast('🎙️', 'Áudio grande demais (máximo 8 MB). Grave um trecho mais curto.', false); return; }
  try {
    const buf = await file.arrayBuffer();
    if (cat.startsWith('task:') || cat.startsWith('hora:')) for (const old of clipsOf(cat)) await idbTx('readwrite', st => st.delete(old.id));
    const c = { id: 'c' + Date.now().toString(36) + rint(1000), cat, label: '', buf, type: file.type || 'audio/mp4', name: file.name, created: Date.now() };
    await idbTx('readwrite', st => st.put(c));
    await loadClips();
    renderParents(); renderMissions();
    const nc = clips.find(x => x.id === c.id);
    if (nc) {
      const a = new Audio(nc.url);
      a.play().then(() => toast('🎙️', 'Áudio guardado! Escreva o que vocês falaram.', false)).catch(() => toast('⚠️', 'Áudio guardado, mas este aparelho não consegue tocar esse formato. Tente gravar em .m4a ou .mp3.', false));
    }
  } catch (e) { toast('⚠️', 'Não consegui guardar esse áudio neste aparelho.', false); }
}

      <label class="chk"><input type="checkbox" id="pSing" ${S.voice.sing ? 'checked' : ''}> Jeito cantado (a voz sobe e desce)</label>
      <div class="row" style="justify-content:flex-start"><button class="btn" id="pTest">🔊 Testar voz</button><button class="btn alt" id="pVoiceReset">Voltar ao padrão</button></div>
      <p class="small" style="margin:0">As vozes vêm do próprio aparelho. No iPad e no iPhone, baixe uma voz em português do Brasil marcada como "Aprimorada" em Ajustes › Acessibilidade › Conteúdo Falado › Vozes. No Android, ela vem do app de voz do Google. Algumas vozes ignoram o ajuste de tom.</p>
    </div>

    <div class="card pcard pform"><h3>🐷 Cofrinho da semana</h3>
      <label class="chk"><input type="checkbox" id="pRewOn" ${S.reward.on ? 'checked' : ''}> Mostrar o cofrinho e dar recompensa em dinheiro</label>
      <label for="pRewVal">Valor da recompensa (R$)</label>
      <input id="pRewVal" type="number" inputmode="decimal" min="0" step="0.5" value="${S.reward.value}">
      <div class="plabel">Dias completos na semana para ganhar</div>
      <div class="stepper"><button class="btn alt round" data-goal="-1" aria-label="Menos">−</button><output>${S.reward.goal} de 7</output><button class="btn alt round" data-goal="1" aria-label="Mais">+</button></div>
      <p class="small" style="margin:0">Semana de segunda a domingo. Um dia completo é quando todas as missões daquele dia foram feitas. Esta semana: ${weekDone()} de ${S.reward.goal} dias.</p>
      ${Object.entries(S.rewards).filter(([, r]) => !r.paid).sort().map(([wk, r]) => `<div class="prow"><span class="pi">🎁</span><div><div class="pn">${money(r.value)}</div><div class="pm">Semana de ${parseKey(wk).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })} · a entregar</div></div><button class="btn good round" data-paid="${wk}" aria-label="Marcar como entregue">✓</button></div>`).join('')}
      <p class="small" style="margin:0">Total já colocado no cofrinho: <b>${money(S.saved)}</b></p>
      ${confirmPig ? `<div class="row" style="justify-content:flex-start"><button class="btn danger" id="pPigYes">Sim, zerar o total</button><button class="btn alt" id="pPigNo">Cancelar</button></div>` : S.saved > 0 ? `<button class="btn alt" id="pPig">Zerar total (ela usou o dinheiro)</button>` : ''}
    </div>

    <div class="card pcard"><h3>Estrelas bônus</h3>
      <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn gold" data-bonus="1">+1 ⭐</button><button class="btn gold" data-bonus="5">+5 ⭐</button>${S.xpOn ? '<button class="btn alt" data-bonusxp="50">+50 XP ⚡</button>' : ''}</div>
    </div>

    <div class="card pcard"><h3>Zerar progresso</h3>
      <p class="small">Apaga estrelas, nível, adesivos, troféus, itens da loja e histórico. As missões e as configurações continuam.</p>
      ${confirmReset ? `<p class="small" style="color:var(--pink)">Tem certeza? Não dá para desfazer.</p><div class="row" style="justify-content:flex-start"><button class="btn danger" id="pResetYes">Sim, zerar tudo</button><button class="btn alt" id="pResetNo">Cancelar</button></div>` : `<button class="btn danger" id="pReset">Zerar progresso</button>`}
    </div>`;
}
$('#tab-pais').addEventListener('click', e => {
  const t = e.target;
  const swb = t.closest('[data-swap]'); if (swb) { const tk = S.tasks.find(x => x.id === swb.dataset.swap); if (tk) swapSheet('swap', planDay, tk); return; }
  if (t.closest('[data-addextra]')) { swapSheet('extra', planDay, null); return; }
  if (t.closest('[data-banknew]')) { swapSheet('bank', planDay, null); return; }
  const usw = t.closest('[data-unswap]'); if (usw) { delete editOf(planDay).swaps[usw.dataset.unswap]; afterPlanChange(planDay); return; }
  const usk = t.closest('[data-unskip]'); if (usk) { const e = editOf(planDay); e.skip = e.skip.filter(x => x !== usk.dataset.unskip); afterPlanChange(planDay); return; }
  const ss = t.closest('[data-setstk]'); if (ss) { const sk = S.stickers.find(x => x.d === planDay); if (sk) { sk.e = ss.dataset.setstk; urgentPush = true; save(); chime('ok'); renderParents(); } return; }
  const uex = t.closest('[data-unextra]'); if (uex) { const e = editOf(planDay); e.extra = e.extra.filter(x => x.id !== uex.dataset.unextra); afterPlanChange(planDay); return; }
  const cm = t.closest('[data-cmonth]'); if (cm) { calMonth = addMonths(calMonth, +cm.dataset.cmonth); renderParents(); return; }
  const cd = t.closest('[data-cday]'); if (cd) { planDay = cd.dataset.cday; calMonth = monthOf(planDay); renderParents(); const pn = $('#dayPanel'); if (pn) pn.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); return; }
  const tg = t.closest('[data-toggle]');
  if (tg) { const tk = findTask(tg.dataset.toggle, planDay); if (tk) { const on = !(S.history[planDay] && S.history[planDay].done[tk.id]); const res = setTaskDone(planDay, tk, on) || {}; finishParentEdit(planDay, res); } return; }
  if (t.closest('[data-allday]')) { const k = planDay; let res = {}; dayTasks(k).forEach(tk => { const r = setTaskDone(k, tk, true); if (r) res = { sticker: res.sticker || r.sticker, reward: res.reward || r.reward }; }); finishParentEdit(k, res); return; }
  const bdl = t.closest('[data-bankdel]'); if (bdl) { S.swapBank = S.swapBank.filter(x => x.id !== bdl.dataset.bankdel); save(); renderParents(); return; }
  if (t.closest('#pExport')) { exportBackup(); const m = $('#pBkMsg'); if (m) m.textContent = 'Backup salvo nos downloads do aparelho.'; return; }
  const se = t.closest('[data-sedit]'); if (se) { editSched(se.dataset.sedit); return; }
  const pl = t.closest('[data-play]'); if (pl) { const c = clips.find(x => x.id === pl.dataset.play); if (c) playClip(c); return; }
  const dc = t.closest('[data-delclip]');
  if (dc) {
    const id = dc.dataset.delclip;
    if (delClip !== id) { delClip = id; renderParents(); return; }
    delClip = null;
    idbTx('readwrite', st => st.delete(id)).then(loadClips).then(() => { renderParents(); renderMissions(); }).catch(() => toast('⚠️', 'Não consegui apagar o áudio.', false));
    return;
  }
  if (t.closest('#pLock')) { parentOK = false; confirmReset = false; renderParents(); return; }
  const ed = t.closest('[data-edit]'); if (ed) { editTask(ed.dataset.edit); return; }
  const stp = t.closest('[data-step]');
  if (stp) {
    const f = stp.dataset.step, d = +stp.dataset.d;
    const lim = f === 'gameCost' ? [1, 50] : [1, 10];
    S[f] = Math.min(lim[1], Math.max(lim[0], S[f] + d)); save(); renderParents(); return;
  }
  const ln = t.closest('[data-luna]'); if (ln) { S.luna = ln.dataset.luna; save(); renderParents(); renderHero(true); return; }
  const bx = t.closest('[data-bonusxp]');
  if (bx) { const lb = xpLevel(); S.xp += +bx.dataset.bonusxp; checkTrophies(); save(); renderTop(); renderHero(true); const r = bx.getBoundingClientRect(); xpFloat(r.left + r.width / 2, r.top, +bx.dataset.bonusxp); chime('ok'); if (xpLevel() > lb) levelToast(xpLevel()); return; }
  if (t.closest('#pMsgSave')) { S.customMsgs = $('#pMsgs').value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 60); save(); renderMissions(); const m = $('#pMsgOk'); if (m) m.textContent = `${S.customMsgs.length} ${S.customMsgs.length === 1 ? 'recado salvo' : 'recados salvos'}.`; return; }
  const bn = t.closest('[data-bonus]');
  if (bn) { const n = +bn.dataset.bonus; S.stars += n; S.earned += n; checkTrophies(); save(); renderTop(); renderHero(); const r = bn.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + 20, 10); chime('ok'); return; }
  const gl = t.closest('[data-goal]');
  if (gl) { S.reward.goal = Math.min(7, Math.max(1, S.reward.goal + +gl.dataset.goal)); afterRewardChange(); return; }
  const pd = t.closest('[data-paid]');
  if (pd) { const r = S.rewards[pd.dataset.paid]; if (r && !r.paid) { r.paid = true; r.paidDate = todayKey(); S.saved = Math.round((S.saved + r.value) * 100) / 100; save(); chime('coin'); const b = pd.getBoundingClientRect(); burst(b.left + 32, b.top + 32, 12); renderParents(); renderMissions(); } return; }
  if (t.closest('#pPig')) { confirmPig = true; renderParents(); return; }
  if (t.closest('#pPigNo')) { confirmPig = false; renderParents(); return; }
  if (t.closest('#pPigYes')) { S.saved = 0; confirmPig = false; save(); renderParents(); renderMissions(); return; }
  if (t.closest('#pTest')) { ac(); speak(`Oi, ${NAME}! Eu sou a fadinha das estrelas! Vamos brilhar hoje? Uhuu!`); return; }
  if (t.closest('#pVoiceReset')) { S.voice = defaults().voice; save(); renderParents(); speak(`Oi, ${NAME}!`); return; }
  if (t.closest('#pReset')) { confirmReset = true; renderParents(); return; }
  if (t.closest('#pResetNo')) { confirmReset = false; renderParents(); return; }
  if (t.closest('#pResetYes')) {
    const keep = { tasks: S.tasks, altStart: S.altStart, gameCost: S.gameCost, gameLimit: S.gameLimit, luna: S.luna, muted: S.muted, autoSpeak: S.autoSpeak, swapBank: S.swapBank, dayEdits: S.dayEdits, voice: S.voice, reward: S.reward, mig: 2, xpOn: S.xpOn, customMsgs: S.customMsgs, myVoice: S.myVoice, autoMyVoice: S.autoMyVoice };
    keep.resetAt = Date.now(); S = Object.assign(defaults(), keep); confirmReset = false; save();
    sayNow = greeting(); sayClip = null; sayCat = 'oi'; renderAll(true); renderParents(); return;
  }
});
function pitchLabel(p) { return p >= 1.7 ? 'fininha de fada' : p >= 1.3 ? 'alegre' : p >= 0.95 ? 'normal' : 'grossinha'; }
function rateLabel(r) { return r >= 1.2 ? 'rapidinha' : r >= 0.95 ? 'normal' : 'devagarinho'; }
$('#tab-pais').addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details.vcat')) return;
  if (d.open) openCats.add(d.dataset.k); else openCats.delete(d.dataset.k);
}, true);
$('#tab-pais').addEventListener('input', e => {
  if (e.target.id === 'pPitch') { S.voice.pitch = +e.target.value; $('#oPitch').textContent = pitchLabel(S.voice.pitch); }
  if (e.target.id === 'pRate') { S.voice.rate = +e.target.value; $('#oRate').textContent = rateLabel(S.voice.rate); }
});
$('#tab-pais').addEventListener('change', e => {
  if (e.target.id === 'pAlt' && e.target.value) { S.altStart = e.target.value; save(); renderMissions(); renderParents(); }
  if (e.target.id === 'pAuto') { S.autoSpeak = e.target.checked; save(); }
  if (e.target.id === 'pImport' && e.target.files && e.target.files[0]) {
    const f = e.target.files[0]; e.target.value = '';
    f.text().then(txt => { importBackup(JSON.parse(txt)); sayNow = greeting(); renderAll(true); const m = $('#pBkMsg'); if (m) m.textContent = '✅ Backup restaurado.'; chime('big'); })
      .catch(() => { const m = $('#pBkMsg'); if (m) m.textContent = 'Não consegui ler esse arquivo. Escolha um backup salvo por este app (.json).'; });
  }
  if (e.target.id === 'pSchedOn') { S.schedAlert = e.target.checked; save(); }
  if (e.target.id === 'pSchedPre') { S.schedPre = e.target.checked; save(); }
  if (e.target.matches('[data-up]')) { addClip(e.target.dataset.up, e.target.files && e.target.files[0]); e.target.value = ''; }
  if (e.target.matches('[data-label]')) saveClipLabel(e.target.dataset.label, e.target.value);
  if (e.target.id === 'pMy') { S.myVoice = e.target.checked; save(); renderMissions(); }
  if (e.target.id === 'pAutoMy') { S.autoMyVoice = e.target.checked; save(); }
  if (e.target.id === 'pXp') { S.xpOn = e.target.checked; save(); renderTop(); renderHero(true); renderMissions(); renderParents(); }
  if (e.target.id === 'pVoice') { S.voice.name = e.target.value; save(); speak(`Oi, ${NAME}! Gostou da minha voz?`); }
  if (e.target.id === 'pSing') { S.voice.sing = e.target.checked; save(); }
  if (e.target.id === 'pRewOn') { S.reward.on = e.target.checked; afterRewardChange(); }
  if (e.target.id === 'pRewVal') { const v = Math.max(0, Math.round((+e.target.value || 0) * 100) / 100); S.reward.value = v; const r = S.rewards[weekStart()]; if (r && !r.paid) r.value = v; save(); renderMissions(); renderParents(); }
  if (e.target.id === 'pPitch' || e.target.id === 'pRate') { save(); speak(`Plim! Oi, ${NAME}!`); }
});

function afterRewardChange() {
  const r = grantReward(); save(); renderParents(); renderMissions();
  if (r) { checkTrophies(); save(); rewardModal(r); }
}
function editTask(id) {
  const isNew = id === 'new';
  const t = isNew ? { id: 't' + Date.now().toString(36), icon: '⭐', name: '', pts: 2, block: 'manha', alt: false, sched: 'all' } : Object.assign({}, S.tasks.find(x => x.id === id));
  t.sched = schedOf(t);
  let delAsk = false;
  const draw = box => {
    box.querySelector('.sheet').innerHTML = `
      <h3 style="font-size:26px">${isNew ? 'Nova missão' : 'Editar missão'}</h3>
      <div class="pform">
        <div class="plabel">Ícone</div>
        <div class="emoji-grid">${TASK_EMOJI.map(em => `<button data-em="${em}" aria-pressed="${t.icon === em}">${em}</button>`).join('')}</div>
        <label for="fIcon">Ou escreva outro emoji</label><input id="fIcon" type="text" maxlength="8" value="${esc(t.icon)}">
        <label for="fName">Nome curto</label><input id="fName" type="text" maxlength="40" value="${esc(t.name)}" placeholder="Ex.: Guardar os sapatos">
        <div class="plabel">Estrelas</div>
        <div class="stepper"><button class="btn alt round" data-p="-1" aria-label="Menos">−</button><output id="fPts">${t.pts} ⭐</output><button class="btn alt round" data-p="1" aria-label="Mais">+</button></div>
        <div class="plabel">XP</div>
        <div class="stepper"><button class="btn alt round" data-x="-5" aria-label="Menos XP">−</button><output>${taskXP(t)} ⚡</output><button class="btn alt round" data-x="5" aria-label="Mais XP">+</button></div>
        <div class="plabel">Bloco do dia</div>
        <div class="seg">${Object.entries(BLOCKS).map(([k, B]) => `<button data-blk="${k}" aria-pressed="${t.block === k}">${B.ic} ${B.n}</button>`).join('')}</div>
        <div class="plabel">Quando aparece</div>
        <div class="seg">${Object.entries(SCHED).map(([k, n]) => `<button data-sch="${k}" aria-pressed="${t.sched === k}">${n}</button>`).join('')}</div>
        <label class="chk"><input type="checkbox" id="fNo" ${t.no ? 'checked' : ''}> Missão de "não fazer" (mostra 🚫 no ícone)</label>
        <p class="small" id="fMsg" style="margin:0;min-height:1.2em"></p>
        <div class="row"><button class="btn" id="fSave">Salvar</button><button class="btn alt" data-close>Cancelar</button></div>
        ${isNew ? '' : delAsk ? `<div class="row"><button class="btn danger" id="fDelYes">Sim, remover</button><button class="btn alt" id="fDelNo">Manter</button></div>` : `<button class="btn danger" id="fDel">Remover missão</button>`}
      </div>`;
  };
  modal('', box => {
    draw(box);
    const sheet = box.querySelector('.sheet');
    const sync = () => { t.icon = $('#fIcon').value.trim() || t.icon; t.name = $('#fName').value; t.no = $('#fNo').checked; };
    sheet.onclick = e => {
      const em = e.target.closest('[data-em]'); if (em) { sync(); t.icon = em.dataset.em; draw(box); return; }
      const p = e.target.closest('[data-p]'); if (p) { sync(); t.pts = Math.min(10, Math.max(1, t.pts + +p.dataset.p)); draw(box); return; }
      const bl = e.target.closest('[data-blk]'); if (bl) { sync(); t.block = bl.dataset.blk; draw(box); return; }
      const xx = e.target.closest('[data-x]'); if (xx) { sync(); t.xp = Math.min(200, Math.max(5, taskXP(t) + +xx.dataset.x)); draw(box); return; }
      const sc = e.target.closest('[data-sch]'); if (sc) { sync(); t.sched = sc.dataset.sch; t.alt = t.sched === 'alt'; draw(box); return; }
      if (e.target.closest('#fDel')) { sync(); delAsk = true; draw(box); return; }
      if (e.target.closest('#fDelNo')) { sync(); delAsk = false; draw(box); return; }
      if (e.target.closest('#fDelYes')) { S.tasks = S.tasks.filter(x => x.id !== t.id); save(); nextModal(); renderMissions(); renderParents(); return; }
      if (e.target.closest('#fSave')) {
        sync(); t.name = t.name.trim();
        if (!t.name) { $('#fMsg').textContent = 'Escreva um nome para a missão.'; return; }
        if (isNew) S.tasks.push(t); else S.tasks = S.tasks.map(x => x.id === t.id ? t : x);
        save(); nextModal(); renderMissions(); renderParents();
      }
    };
  }, 'form');
}

/* ---------- navegação ---------- */
let current = 'missoes';
function showTab(id) {
  if (current === 'pais' && id !== 'pais') { parentOK = false; confirmReset = false; }
  current = id;
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === id ? 'true' : 'false'));
  $$('.view').forEach(v => { v.hidden = v.id !== 'tab-' + id; });
  if (id === 'missoes') renderMissions();
  if (id === 'jogos') renderGames();
  if (id === 'relogio') renderClock();
  if (id === 'album') renderAlbum();
  if (id === 'loja') renderShop();
  if (id === 'pais') renderParents();
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}
$$('.tab').forEach(t => t.addEventListener('click', () => { chime('tick'); showTab(t.dataset.tab); }));
$('#lvlChip').addEventListener('click', () => showTab('album'));
$('#muteBtn').addEventListener('click', () => { S.muted = !S.muted; save(); renderTop(); if (!S.muted) chime('ok'); else if ('speechSynthesis' in window) speechSynthesis.cancel(); });

function renderAll(force) {
  renderTop(); if (force) renderHero(true);
  renderMissions();
  if (current === 'jogos') renderGames();
  if (current === 'relogio') renderClock();
  if (current === 'album') renderAlbum();
  if (current === 'loja') renderShop();
  if (current === 'pais') renderParents();
}

/* virada do dia */
let curDay = todayKey();
function checkDay() { if (todayKey() !== curDay) { curDay = todayKey(); sayNow = greeting(); sayClip = null; sayCat = 'oi'; renderAll(true); } }
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });

/* início */
buildSky();
sayNow = greeting(); sayCat = 'oi';
loadClips().then(() => { renderMissions(); if (current === 'pais' && parentOK) renderParents(); });
healDays(); save(true);
renderTop();
renderHero(true);
renderMissions();
})();
</script>

</body>
</html>
